name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: 格式检查（含 spikes，零成本）
        run: cargo fmt --all --check
      - name: clippy（零警告门禁；排除 spikes——原型代码不进门禁，
          且 spike-melib 的 maildir/imap-trace 特性会与主构建合并拉长编译）
        run: cargo clippy --workspace --exclude spike-fts --exclude spike-ime --exclude spike-list --exclude spike-melib --all-targets -- -D warnings

  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 单元测试（排除 spikes；spikes 的编译岗哨在 check-windows）
        run: cargo test --workspace --exclude spike-fts --exclude spike-ime --exclude spike-list --exclude spike-melib
      - name: 编译检查（含 examples；同上排除 spikes）
        run: cargo check --workspace --exclude spike-fts --exclude spike-ime --exclude spike-list --exclude spike-melib --all-targets

  check-windows:
    # 路线图：Windows 构建验证（只 check 不跑 e2e；首跑若红可按报错补平台适配）。
    # 保持全量 --workspace：兼作 spikes 原型的编译岗哨（其余 job 已排除它们，
    # 这里是唯一能发现 spike 代码腐烂的地方）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 编译检查（全 workspace 含 spikes）
        run: cargo check --workspace

  perf:
    # 性能回归门禁：核心指标（release，确定性无网络）+ 二进制体积。
    # GUI 冷启动（~0.7s）与稳态 RSS（~100MB）无法无头测量，
    # 保持 DOGFOOD.md 手工流程；本 job 兼作 release 编译检查。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: release 构建（含 perf example）
        run: cargo build --release -p smail-ui -p smail-core --examples
      - name: 核心性能基线（万封：冷开/写入/FTS检索/列表）
        run: ./target/release/examples/perf
      - name: 二进制体积门禁（strip 后 < 32MB）
        run: |
          strip target/release/s-mail
          size=$(stat -c%s target/release/s-mail)
          echo "strip 后二进制：$((size / 1024 / 1024))MB（$size 字节）"
          # 2026-10 实测约 26MB（README 的 20MB 已过时）；32MB 只拦严重膨胀
          [ "$size" -lt $((32 * 1024 * 1024)) ]

  e2e:
    # e2e 需要 docker 起本地 dovecot；跑 m5（多账号）/ m14（移动批量）/ m15（草稿云同步）
    # 三个 headless 全链路。m2-m13 含 SMTP/OAuth mock 等前置，暂不进矩阵。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 构建 e2e
        run: cargo build -p smail-core --examples
      - name: 起 dovecot
        run: sh spikes/spike-melib/imap-test/up.sh
      - name: m5 多账号 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.multi.toml
          SMAIL_HOME: /tmp/smail-ci-m5
        run: timeout 90 ./target/debug/examples/m5 80
      - name: m14 移动/批量/文件夹/联系人 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m14
        run: timeout 120 ./target/debug/examples/m14 60
      - name: m15 草稿云同步 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m15
        run: timeout 120 ./target/debug/examples/m15 60
      - name: m16 草稿双向同步 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m16
        run: timeout 120 ./target/debug/examples/m16 60
      - name: m4 HTML 消毒 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m4
        run: |
          python3 spikes/spike-melib/imap-test/inject_html_mail.py
          sleep 2
          timeout 90 ./target/debug/examples/m4 50
      - name: m7 会话聚合 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m7
        run: |
          python3 spikes/spike-melib/imap-test/seed_thread.py
          sleep 2
          timeout 90 ./target/debug/examples/m7 50
      - name: m8 规则过滤 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.rules.toml
          SMAIL_HOME: /tmp/smail-ci-m8
        run: |
          python3 spikes/spike-melib/imap-test/seed_rules.py
          sleep 2
          timeout 90 ./target/debug/examples/m8 50
      - name: m13 服务端删除传播 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m13
        run: timeout 120 ./target/debug/examples/m13 50
      - name: m17 离线优先 e2e（停服务器后本地可用）
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m17
        run: timeout 120 ./target/debug/examples/m17 60
      - name: m18 废纸篓两段删除 e2e
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m18
        run: timeout 120 ./target/debug/examples/m18 90
      - name: m2 发信+Sent归档+删除 e2e（需 SMTP mock）
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m2
        run: |
          python3 spikes/spike-melib/imap-test/mini_smtp.py 11525 &
          sleep 2
          timeout 90 ./target/debug/examples/m2 60
      - name: m3 附件+全文搜索 e2e（需 SMTP mock）
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.toml
          SMAIL_HOME: /tmp/smail-ci-m3
          SMAIL_DOWNLOADS: /tmp/smail-ci-m3-dl
          SMAIL_NO_REVEAL: "1"
        run: |
          python3 spikes/spike-melib/imap-test/mini_smtp.py 11525 &
          sleep 2
          timeout 120 ./target/debug/examples/m3 80

      - name: m9 PGP 收信 e2e（自产密钥）
        env:
          SMAIL_CONFIG: spikes/spike-melib/config.pgp.toml
          SMAIL_HOME: /tmp/smail-ci-m9
        run: timeout 90 ./target/debug/examples/m9 70
      - name: m11 应用内配置+OAuth 设备流 e2e（需 OAuth mock）
        env:
          SMAIL_HOME: /tmp/smail-ci-m11
        run: |
          python3 spikes/spike-melib/imap-test/mock_oauth.py 18888 /tmp/mock-oauth-ci.json &
          sleep 2
          timeout 90 ./target/debug/examples/m11 60
