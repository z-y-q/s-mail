[workspace]
resolver = "2"
# spikes 留在 members（共享 workspace 继承与 IDE），但 CI 的 lint/test
# 作业用 --exclude 排除它们（spike-melib 的 maildir/imap-trace 特性会
# 与主构建特性合并拉长编译）。
members = [
    "crates/smail-ai",
    "crates/smail-backend",
    "crates/smail-core",
    "crates/smail-store",
    "crates/smail-ui",
    "spikes/spike-ime",
    "spikes/spike-list",
    "spikes/spike-fts",
    "spikes/spike-melib",
]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.5"
edition = "2021"
rust-version = "1.87"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
# melib 钉子链（round-3 风险表 R8：pre-release 漂移会编译崩，升级 melib 时同步重估）
# sqlite3 已关：melib 的 IMAP sqlite 缓存回放（InitialCache）不填充 hash→UID
# 映射（uid_store.hash_index 只由真实 FETCH 响应填充），而 melib 的删除/标记/
# 移动全部依赖该映射，映射缺失时 uids 为空**静默返回成功**——表现为清空废纸篓、
# 删除、已读上推全部假成功，下次同步邮件/未读「复活」。关掉缓存后每次 fetch
# 走真实 FETCH（全量），映射永远齐全，写操作不再有静默空转；列表显示由
# UI 本地索引缓存兜底，网络延迟不拖累界面。
# rusqlite 统一 0.37（smail-store 自用 bundled SQLite）
melib = { version = "0.8", default-features = false, features = ["imap"] }
imap-codec = "=2.0.0-alpha.4"
imap-types = "=2.0.0-alpha.3"
rusqlite = { version = "0.37", features = ["bundled"] }
iced = { version = "0.14", features = ["tokio", "markdown", "image"] }
tokio = { version = "1", features = ["rt", "sync"] }
futures = "0.3"
futures-timer = "3"
mail-parser = "0.11"
lettre = "0.11"
ammonia = "4"
scraper = "0.23"
ego-tree = "0.10"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "3", features = ["json"] }
base64 = "0.22"
anyhow = "1"
thiserror = "2"
sha1 = "0.10"
mime_guess = "2"
# 纯 Rust 加密后端（避免系统 nettle）；压缩包解压用
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-rust", "compression-deflate", "allow-experimental-crypto", "allow-variable-time-crypto"] }

# melib 本地补丁（基于 0.8.13）：修 macOS Happy-Eyeballs 竞态——非阻塞 connect
# 完成后 SO_ERROR 残留 EISCONN，二次 connect 返回 EISCONN 被误判为失败，
# 导致 macOS 上进入 EINPROGRESS 路径的连接必挂（OS error 56）。
# 详见 vendor/melib/src/utils/connections/std_net.rs 的 s-mail patch 注释。
# 上游是否已修由 .github/workflows/vendor-watch.yml 每周自动检查，
# 修了会变红提醒撤补丁；手动升级前也可看该 workflow 的检查方式。
[patch.crates-io]
melib = { path = "vendor/melib" }

[profile.release]
# S2 列表滚动等性能验证必须用 release
debug = 1
