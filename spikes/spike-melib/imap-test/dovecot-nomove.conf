# s-mail 本地 IMAP 测试服务器（dovecot 2.4 rootless，容器 31143 → 宿主 1143）
# 账号：任意用户名（用 test），密码来自环境变量 USER_PASSWORD（up.sh 设为 testpass）
# 注意：dovecot 2.4 配置语法与 2.3 完全不同（config/storage_version 必须首行、
# mail_location → mail_driver/mail_path、disable_plaintext_auth → auth_allow_cleartext、
# 镜像以 vmail 非 root 运行所以用非特权端口 31143）
dovecot_config_version = 2.4.5
dovecot_storage_version = 2.4.5

protocols = imap
listen = *
ssl = no
auth_allow_cleartext = yes

default_internal_user = vmail
default_login_user = vmail
default_internal_group = vmail

mail_driver = maildir
mail_path = /var/mail/%{user}/Maildir
mail_home = /var/mail/%{user}
mailbox_list_layout = fs

service imap-login {
  inet_listener imap {
    port = 31143
  }
}

passdb static {
  password = %{env:USER_PASSWORD}
}

import_environment {
  USER_PASSWORD = %{env:USER_PASSWORD | default("wrongpass")}
}

userdb static {
}

# m21：imap_capability 整行覆盖 = 去掉 MOVE（由 up-nomove.sh 从真实 CAPABILITY 派生）
imap_capability = "IMAP4rev1 SASL-IR LOGIN-REFERRALS ID ENABLE IDLE SORT SORT=DISPLAY THREAD=REFERENCES THREAD=REFS THREAD=ORDEREDSUBJECT MULTIAPPEND URL-PARTIAL CATENATE UNSELECT CHILDREN NAMESPACE UIDPLUS LIST-EXTENDED I18NLEVEL=1 CONDSTORE QRESYNC ESEARCH ESORT SEARCHRES WITHIN CONTEXT=SEARCH LIST-STATUS BINARY REPLACE SNIPPET=FUZZY PREVIEW=FUZZY PREVIEW SPECIAL-USE STATUS=SIZE SAVEDATE COMPRESS=DEFLATE INPROGRESS NOTIFY LITERAL+"
